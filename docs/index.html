<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>innigolf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
/* Layout: one column; the next league night first, scorecard-like tables after. */
:root {
  --bg: #eef2ee;
  --surface: #ffffff;
  --sunk: #e3e9e4;
  --ink: #15211a;
  --muted: #5b6b61;
  --line: #cfd8d1;
  --turf: #1d6f46;
  --turf-ink: #ffffff;
  --turf-soft: #d5ebdd;
  --flag: #c4432c;
  --flag-soft: #f6dcd6;
  --gold: #b88a16;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0e1511; --surface: #16201a; --sunk: #1d2a22; --ink: #e4ece6; --muted: #93a49a;
  --line: #2c3b32; --turf: #47b97d; --turf-ink: #07130c; --turf-soft: #1f3d2b; --flag: #ef7a62; --flag-soft: #3d221c; --gold: #e0b443;
  color-scheme: dark; } }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
[hidden] { display: none !important; }
img { max-width: 100%; }
.wrap { max-width: 960px; margin: 0 auto; padding-block: max(24px, env(safe-area-inset-top, 0px)) 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font: 700 2.3rem/1 var(--display); letter-spacing: .01em; margin: 0; text-transform: uppercase; }
h1 small { display: block; font: 500 .95rem/1.4 var(--body); text-transform: none; color: var(--muted); letter-spacing: 0; margin-top: 6px; }
h2 { font: 600 1.35rem/1.2 var(--display); text-transform: uppercase; letter-spacing: .03em; margin: 0; text-wrap: balance; }
h3 { font: 600 1rem/1.2 var(--body); margin: 0; }
.label { font: 600 .75rem/1 var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.account { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: end; font-size: .92rem; }

.seasons { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px;
  padding: 7px 14px; font: 600 .95rem/1.1 var(--body); cursor: pointer; display: inline-flex; gap: 8px; align-items: baseline; }
.chip small { font-weight: 400; color: var(--muted); font-size: .8rem; }
.chip[aria-pressed="true"] { background: var(--turf); border-color: var(--turf); color: var(--turf-ink); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .8; }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--flag); display: inline-block; align-self: center; }

nav.tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--line); overflow-x: auto; }
nav.tabs button { background: none; border: 0; padding: 10px 14px; font: 600 1.05rem/1 var(--display); text-transform: uppercase;
  letter-spacing: .05em; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--turf); }

.stack { display: grid; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.row.start { justify-content: start; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.facts div { display: grid; gap: 4px; }
.facts b { font: 600 1.4rem/1 var(--display); }
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; min-width: 120px; }
.bar i { display: block; height: 100%; background: var(--turf); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--muted); padding: 7px 12px; font: 600 .9rem/1 var(--body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

.scroll { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { font: 600 .72rem/1.2 var(--body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); text-align: left; padding: 8px 8px; border-bottom: 2px solid var(--ink); white-space: nowrap; }
td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th.r, td.r { text-align: right; }
td.rank { font: 700 1.25rem/1 var(--display); width: 2.5em; color: var(--muted); }
tr.lead td.rank { color: var(--gold); }
td.player { font-weight: 600; white-space: nowrap; }
td.total { font: 700 1.5rem/1 var(--display); text-align: right; }
.cards { display: flex; flex-wrap: wrap; gap: 4px; }
.sc { min-width: 2.1em; text-align: center; padding: 3px 5px; border-radius: 4px; font: 600 .85rem/1.1 var(--body); background: var(--sunk); color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.sc.counts { background: var(--turf-soft); color: var(--ink); text-decoration: none; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--turf) 45%, transparent); }
.pill { display: inline-block; font: 600 .7rem/1 var(--body); text-transform: uppercase; letter-spacing: .06em; padding: 4px 7px; border-radius: 4px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.yes { background: var(--turf-soft); color: var(--turf); }
.pill.no { background: var(--flag-soft); color: var(--flag); }
.tm { font: 600 .78rem/1 var(--mono); padding: 4px 6px; border-radius: 4px; background: var(--sunk); color: var(--ink); white-space: nowrap; }
.tms { display: flex; flex-wrap: wrap; gap: 4px; }

/* Next round */
.hero { display: grid; gap: 6px; }
.hero .date { font: 700 clamp(2.1rem, 7vw, 3.4rem)/.95 var(--display); text-transform: uppercase; letter-spacing: .01em; margin: 0; text-wrap: balance; }
.hero .when { font-size: 1.05rem; color: var(--muted); }
.hero .when b { color: var(--ink); font-weight: 600; }
.soon { display: inline-block; font: 600 .78rem/1 var(--body); text-transform: uppercase; letter-spacing: .08em; padding: 5px 8px; border-radius: 4px; background: var(--flag); color: var(--turf-ink); justify-self: start; }
.rsvp { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.rsvp .btn { padding: 12px 18px; font-size: 1.02rem; }
.rsvp .btn.yes[aria-pressed="true"] { background: var(--turf); border-color: var(--turf); color: var(--turf-ink); }
.rsvp .btn.no[aria-pressed="true"] { background: var(--flag); border-color: var(--flag); color: var(--turf-ink); }
.roster { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.roster section { display: grid; gap: 8px; align-content: start; min-width: 0; }
.roster h3 { display: flex; align-items: baseline; gap: 8px; }
.roster h3 b { font: 700 1.5rem/1 var(--display); }
.roster ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.roster li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; background: var(--bg); min-height: 38px; }
.roster li.me { box-shadow: inset 0 0 0 1px var(--turf); }
.roster .set { display: inline-flex; gap: 4px; }
.roster .set button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 5px; width: 30px; height: 28px; cursor: pointer; font: 600 .85rem/1 var(--body); }
.roster .set button.y:hover, .roster .set button.y[aria-pressed="true"] { color: var(--turf); border-color: var(--turf); }
.roster .set button.n:hover, .roster .set button.n[aria-pressed="true"] { color: var(--flag); border-color: var(--flag); }
.later { display: grid; gap: 0; }
.later > div { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 14px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.later > div:last-child { border-bottom: 0; }

.round { display: grid; gap: 8px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.round:last-child { border-bottom: 0; }
.round .who { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .95rem; }
.round .who span b { font-variant-numeric: tabular-nums; }

label.f { display: grid; gap: 5px; font: 600 .78rem/1.2 var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
label.check { display: inline-flex; gap: 8px; align-items: center; font-size: .95rem; cursor: pointer; }
label.check input { width: auto; }
input, select, textarea { font: 16px/1.3 var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; width: 100%; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, label.btn:focus-within { outline: 2px solid var(--turf); outline-offset: 2px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 7px; padding: 9px 14px; font: 600 .95rem/1 var(--body); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn.primary { background: var(--turf); border-color: var(--turf); color: var(--turf-ink); }
.btn.danger { color: var(--flag); }
.btn.small { padding: 6px 10px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: default; }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 10px; justify-items: start; background: var(--bg); }
.drop.over { border-color: var(--turf); }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumbs img { width: 92px; height: 92px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.entry td { padding: 6px 4px; }
.entry input, .entry select { padding: 6px 8px; }
.entry td.n input { width: 5.2em; text-align: right; }
.entry td.card input { font-family: var(--mono); font-size: 14px; min-width: 9em; }
.entry select { min-width: 10em; }
.entry select.unset { border-color: var(--flag); }
.note { padding: 10px 12px; border-radius: 8px; background: var(--sunk); font-size: .93rem; }
.note.warn { background: color-mix(in srgb, var(--flag) 14%, var(--surface)); }
.note.ok { background: var(--turf-soft); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.signin { display: flex; flex-wrap: wrap; gap: 8px; max-width: 460px; width: 100%; }
.signin input { flex: 1 1 220px; }
.rules { font-size: .92rem; color: var(--muted); max-width: 65ch; margin: 0; }
details > summary { cursor: pointer; color: var(--muted); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .chip, .btn, nav.tabs button { transition: background .15s, color .15s, border-color .15s; } }
h1.brand { text-transform: none; font-size: 2.8rem; letter-spacing: -.01em; }
@media (max-width: 560px) { .hide-sm { display: none; } h1, h1.brand { font-size: 2.2rem; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">innigolf<small>Punktakeppni í golfhermi – bestu hringirnir gilda</small></h1>
    <div class="account" id="account"></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="next" id="tab-next">Næsti hringur</button>
    <button role="tab" data-tab="standings" id="tab-standings">Staðan</button>
    <button role="tab" data-tab="add" id="tab-add">Skrá skor</button>
    <button role="tab" data-tab="rounds" id="tab-rounds">Hringir</button>
    <button role="tab" data-tab="league" id="tab-league">Deildin</button>
  </nav>
  <div class="seasons" id="seasons" role="group" aria-label="Mót"></div>
  <main id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="standings.js"></script>
<script>
const CFG = window.LEAGUE_CONFIG || {};
const PARAMS = new URLSearchParams(location.search);
const DEMO = PARAMS.has('demo');
const LOCALE = 'is-IS';

const S = {
  sb: null, mode: 'loading', // loading | ready | setup | error
  session: null, member: null, // member = {email, name, is_admin, player_id} when on the list
  seasons: [], rounds: [], players: [], events: [], attendance: [], accounts: [],
  register: false, // true once the players/events tables exist
  loaded: false, seasonId: null, tab: 'next', metric: 'points',
  draft: null, photos: [], reading: false, readMsg: null, saveMsg: null,
  confirmDelete: null, editSeason: null, editPlayer: null, editEvent: null,
  signinMsg: null, signinBusy: false, busy: false, flash: null,
  linkMsg: null, // result of answering from an email link
  remindAudience: 'unanswered', reminding: false, remindMsg: null,
};
const canWrite = () => DEMO || !!S.member;
const canEdit = () => DEMO || !!S.member?.is_admin;
const myPlayerId = () => DEMO ? S.players[0]?.id : S.member?.player_id || null;
const photoOn = () => !DEMO && CFG.photoReading !== false;

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
// Icelandic dates written out by hand: not every browser ships Icelandic date names.
const DAYS = ['sunnudagur', 'mánudagur', 'þriðjudagur', 'miðvikudagur', 'fimmtudagur', 'föstudagur', 'laugardagur'];
const DAYS_SHORT = ['sun.', 'mán.', 'þri.', 'mið.', 'fim.', 'fös.', 'lau.'];
const MONTHS = ['janúar', 'febrúar', 'mars', 'apríl', 'maí', 'júní', 'júlí', 'ágúst', 'september', 'október', 'nóvember', 'desember'];
const MONTHS_SHORT = ['jan.', 'feb.', 'mar.', 'apr.', 'maí', 'jún.', 'júl.', 'ágú.', 'sep.', 'okt.', 'nóv.', 'des.'];
const parts = d => { const x = new Date(d + 'T12:00:00'); return { wd: x.getDay(), day: x.getDate(), m: x.getMonth(), y: x.getFullYear() }; };
const fmtDate = d => { const p = parts(d); return `${p.day}. ${MONTHS_SHORT[p.m]}`; };                          // 27. okt.
const fmtDateLong = d => { const p = parts(d); return `${DAYS_SHORT[p.wd]} ${p.day}. ${MONTHS_SHORT[p.m]} ${p.y}`; }; // þri. 27. okt. 2026
const fmtDay = d => { const p = parts(d); return `${DAYS[p.wd]} ${p.day}. ${MONTHS[p.m]}`; };                     // þriðjudagur 27. október
const fmtTime = t => t ? String(t).slice(0, 5) : '';
const fmtStamp = ts => { const x = new Date(ts); const pad = n => String(n).padStart(2, '0'); return `${DAYS_SHORT[x.getDay()]} ${x.getDate()}. ${MONTHS_SHORT[x.getMonth()]} kl. ${pad(x.getHours())}:${pad(x.getMinutes())}`; };
const fmtDec = n => n.toFixed(1).replace('.', ',');
const daysUntil = d => Math.round((new Date(d + 'T12:00:00') - new Date(today() + 'T12:00:00')) / 86400000);
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
// Icelandic numbers ending in 1 (but not 11) take the singular: 1 dagur, 21 dagur, 11 dagar.
const one = n => n % 10 === 1 && n % 100 !== 11;
const plural = (n, sg, pl) => `${n} ${one(n) ? sg : pl}`;

function newDraft() { return { id: null, date: today(), course: '', scores: [blankScore(), blankScore(), blankScore(), blankScore()] }; }
function blankScore() { return { card: '', pick: '', hcp: '', gross: '', points: '' }; }
S.draft = newDraft();

/* ---------- data: Supabase rows <-> page objects ---------- */
const fromSeason = r => ({ id: r.id, name: r.name, start: r.start_date, end: r.end_date, plannedRounds: r.planned_rounds, bestOf: r.best_of });
const toSeason = s => ({ name: s.name, start_date: s.start, end_date: s.end, planned_rounds: s.plannedRounds, best_of: s.bestOf });
const fromRound = r => ({ id: r.id, date: r.played_on, course: r.course, scores: r.scores || [], createdBy: r.created_by });
const toRound = r => ({ played_on: r.date, course: r.course, scores: r.scores, updated_at: new Date().toISOString() });
const fromPlayer = r => ({ id: r.id, name: r.name, ids: r.trackman_ids || [], active: r.active });
const fromEvent = r => ({ id: r.id, date: r.event_date, time: r.start_time, location: r.location, notes: r.notes, remindedAt: r.reminded_at || null });
const toEvent = e => ({ event_date: e.date, start_time: e.time || null, location: e.location, notes: e.notes });

async function loadAll() {
  if (DEMO) { S.loaded = true; afterLoad(); return; }
  const [se, ro, pl, ev, at] = await Promise.all([
    S.sb.from('seasons').select('*').order('start_date'),
    S.sb.from('rounds').select('*').order('played_on', { ascending: false }),
    S.sb.from('players').select('*').order('name'),
    S.sb.from('events').select('*').gte('event_date', addDays(today(), -120)).order('event_date'),
    S.sb.from('attendance').select('event_id,player_id,status'),
  ]);
  if (se.error || ro.error) { console.error(se.error || ro.error); S.mode = 'error'; render(); return; }
  S.seasons = se.data.map(fromSeason);
  S.rounds = ro.data.map(fromRound);
  // The register tables arrive with a database update; until then the page works as before.
  S.register = !pl.error && !ev.error && !at.error;
  S.players = S.register ? pl.data.map(fromPlayer) : [];
  S.events = S.register ? ev.data.map(fromEvent) : [];
  S.attendance = S.register ? at.data : [];
  S.loaded = true;
  afterLoad();
}
function afterLoad() {
  if (!S.seasons.some(s => s.id === S.seasonId)) S.seasonId = pickDefaultSeason();
  renderKeepFocus();
}

async function loadMember() {
  S.member = null; S.accounts = [];
  const email = S.session?.user?.email;
  if (email) {
    const { data, error } = await S.sb.from('members').select('*').ilike('email', email).maybeSingle();
    if (!error && data) S.member = data;
    if (S.member?.is_admin) await loadAccounts();
  }
  render();
}
async function loadAccounts() {
  if (DEMO || !S.member?.is_admin) return;
  const { data, error } = await S.sb.from('members').select('*').order('email');
  S.accounts = error ? [] : data;
}

/* ---------- players and scorecard names ---------- */
function playerById(id) { return S.players.find(p => p.id === id) || null; }
function aliasIndex() {
  const m = new Map();
  for (const p of S.players) {
    for (const t of p.ids) m.set(normCardName(t), p);
    if (!m.has(normCardName(p.name))) m.set(normCardName(p.name), p);
  }
  return m;
}
// The registered player behind a scorecard name: an exact Trackman ID or name match, or,
// for a name the card cut off with "...", the one player whose name or ID starts that way.
function findPlayer(raw, idx = aliasIndex()) {
  const key = normCardName(raw);
  if (!key) return null;
  if (idx.has(key)) return idx.get(key);
  if (!/(\.\.\.|…)\s*$/.test(String(raw))) return null;
  const hits = new Set();
  for (const [k, p] of idx) if (k.startsWith(key)) hits.add(p);
  return hits.size === 1 ? [...hits][0] : null;
}
// Which registered player a saved score belongs to: its stored id, else its scorecard name.
function playerForScore(s, idx = aliasIndex()) {
  if (s.player_id) return playerById(s.player_id);
  return findPlayer(s.card_name || s.player, idx);
}
function standingsOpts() {
  const idx = aliasIndex();
  return {
    keyOf: s => { const p = playerForScore(s, idx); return p ? 'id:' + p.id : 'card:' + normCardName(s.card_name || s.player); },
    nameOf: s => playerForScore(s, idx)?.name || String(s.card_name || s.player || '').trim(),
  };
}
function unmatchedCardNames() {
  const idx = aliasIndex(), m = new Map();
  for (const r of S.rounds) for (const s of r.scores || []) {
    if (s.guest || playerForScore(s, idx)) continue;
    const raw = String(s.card_name || s.player || '').trim(); if (!raw) continue;
    const k = normCardName(raw);
    const e = m.get(k) || { name: raw, count: 0 }; e.count++; m.set(k, e);
  }
  return [...m.values()].sort((a, b) => b.count - a.count);
}
const activePlayers = () => S.players.filter(p => p.active).sort((a, b) => a.name.localeCompare(b.name, LOCALE));
const hasEmail = p => DEMO ? true : S.accounts.some(a => a.player_id === p.id);

/* ---------- events ---------- */
const activeEvent = () => nextEvent(S.events, today());
const answerOf = (eventId, playerId) => S.attendance.find(a => a.event_id === eventId && a.player_id === playerId)?.status || null;

/* ---------- helpers ---------- */
function sortedSeasons() { return [...S.seasons].sort((a, b) => a.start.localeCompare(b.start)); }
function currentSeason() { return S.seasons.find(s => s.id === S.seasonId) || null; }
function pickDefaultSeason() {
  const list = sortedSeasons();
  if (!list.length) return null;
  const t = today();
  return (list.find(s => s.start <= t && t <= s.end) || list.find(s => s.start > t) || list[list.length - 1]).id;
}

/* ---------- render ---------- */
function render() {
  renderAccount();
  $('#seasons').hidden = !['standings', 'rounds'].includes(S.tab);
  renderSeasons();
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  const m = $('#main');
  if (S.mode === 'setup') { m.innerHTML = `<div class="panel empty"><h2>Næstum tilbúið</h2><p>Síðan er ekki enn tengd gagnagrunni. Settu slóð og lykil Supabase-verkefnisins í <b>config.js</b> (sjá README), eða <a href="?demo">skoðaðu sýnishornið</a>.</p></div>`; return; }
  if (S.mode === 'error') { m.innerHTML = `<div class="panel empty"><h2>Ekki tókst að sækja gögnin</h2><p>Athugaðu nettenginguna og endurhlaðaðu síðunni. Ef þetta gerist aftur skaltu athuga Supabase-slóðina og lykilinn í config.js.</p></div>`; return; }
  const view = { next: viewNext, standings: viewStandings, add: viewAdd, rounds: viewRounds, league: viewLeague }[S.tab] || viewNext;
  m.innerHTML = view();
}

function renderAccount() {
  const a = $('#account');
  if (DEMO) { a.innerHTML = '<span class="pill">Sýnishorn með dæmagögnum. Ekkert er vistað.</span>'; return; }
  if (S.mode !== 'ready') { a.innerHTML = ''; return; }
  if (!S.session) { a.innerHTML = `<button class="btn small" id="go-signin">Skrá inn</button>`; return; }
  const who = playerById(S.member?.player_id)?.name || S.member?.name || S.session.user.email;
  a.innerHTML = `<span class="muted">${esc(who)}${S.member?.is_admin ? ' · umsjón' : ''}</span><button class="btn small" id="sign-out">Skrá út</button>`;
}

function renderSeasons() {
  const t = today();
  const list = sortedSeasons();
  $('#seasons').innerHTML = list.length ? list.map(s => {
    const live = s.start <= t && t <= s.end;
    return `<button class="chip" aria-pressed="${s.id === S.seasonId}" data-season="${esc(s.id)}">${live ? '<span class="live" title="Stendur yfir"></span>' : ''}${esc(s.name)}<small>${fmtDate(s.start)} – ${fmtDate(s.end)}</small></button>`;
  }).join('') : (S.loaded ? '<span class="muted">Engin mót enn. Bættu við móti undir Deildin.</span>' : '');
}

function signInPanel(reason) {
  if (S.session && !S.member) return `<div class="panel empty"><h2>Netfangið er ekki á listanum</h2>
    <p>Netfangið <b>${esc(S.session.user.email)}</b> er ekki skráð í deildina. Biddu umsjónarmann að bæta því við og endurhlaðaðu svo síðunni.</p>
    <button class="btn" id="sign-out">Nota annað netfang</button></div>`;
  return `<div class="panel empty"><h2>Skráðu þig inn til að ${esc(reason)}</h2>
    <p>Sláðu inn netfangið sem umsjónarmaðurinn skráði. Við sendum þér innskráningarhlekk í tölvupósti; ekkert lykilorð þarf.</p>
    ${signInForm()}</div>`;
}
function signInForm() {
  return `<form class="signin" id="signin-form">
      <input id="signin-email" type="email" autocomplete="email" placeholder="netfang@dæmi.is" required>
      <button class="btn primary" ${S.signinBusy ? 'disabled' : ''}>${S.signinBusy ? 'Sendi…' : 'Senda mér hlekk'}</button>
    </form>
    ${S.signinMsg ? `<div class="note ${S.signinMsg.kind}">${esc(S.signinMsg.text)}</div>` : ''}`;
}
const registerMissing = () => `<div class="panel empty"><h2>Uppfæra þarf gagnagrunninn</h2><p>Leikmannaskrá og golfkvöld þurfa uppfærsluna í <b>supabase/migrations/20261023_players_events.sql</b>. Keyrðu hana í SQL Editor í Supabase og endurhlaðaðu síðan.</p></div>`;

/* ---------- Næsti hringur ---------- */
function viewNext() {
  if (!S.loaded) return `<div class="panel empty"><p>Hleð…</p></div>`;
  if (!S.register) return registerMissing();
  const banner = S.linkMsg ? `<div class="note ${S.linkMsg.kind}" role="status">${esc(S.linkMsg.text)}</div>` : '';
  const ev = activeEvent();
  if (!ev) return `<div class="stack">${banner}<div class="panel empty"><h2>Enginn hringur á dagskrá</h2><p>${canEdit() ? 'Bættu næstu golfkvöldum við undir Deildin.' : 'Umsjónarmaður hefur ekki sett inn næsta golfkvöld.'}</p>${canEdit() ? '<button class="btn primary" data-go="league">Bæta við golfkvöldum</button>' : ''}</div></div>`;
  const d = daysUntil(ev.date);
  const soon = d === 0 ? 'Í dag' : d === 1 ? 'Á morgun' : `Eftir ${plural(d, 'dag', 'daga')}`;
  const me = myPlayerId();
  const mine = me ? answerOf(ev.id, me) : null;
  const players = activePlayers();
  const yes = players.filter(p => answerOf(ev.id, p.id) === 'yes');
  const no = players.filter(p => answerOf(ev.id, p.id) === 'no');
  const none = players.filter(p => !answerOf(ev.id, p.id));
  let answerBlock;
  if (me) answerBlock = `<div class="rsvp" role="group" aria-label="Svarið þitt">
      <button class="btn yes" data-rsvp="yes" data-ev="${esc(ev.id)}" data-pl="${esc(me)}" aria-pressed="${mine === 'yes'}" ${S.busy ? 'disabled' : ''}>${mine === 'yes' ? '✓ ' : ''}Ég mæti</button>
      <button class="btn no" data-rsvp="no" data-ev="${esc(ev.id)}" data-pl="${esc(me)}" aria-pressed="${mine === 'no'}" ${S.busy ? 'disabled' : ''}>${mine === 'no' ? '✕ ' : ''}Kemst ekki</button>
      <span class="muted">${mine ? 'Ýttu aftur til að hreinsa svarið.' : 'Láttu hina vita.'}</span>
    </div>`;
  else if (S.session && S.member) answerBlock = `<div class="note">Innskráningin þín er ekki tengd leikmanni. Biddu umsjónarmann að tengja hana undir Deildin.</div>`;
  else if (S.session) answerBlock = `<div class="note">Netfangið ${esc(S.session.user.email)} er ekki skráð. Biddu umsjónarmann að bæta því við.</div>`;
  else answerBlock = `<div class="stack"><div class="muted">Skráðu þig inn til að svara hvort þú mætir, eða notaðu hlekkina í áminningarpóstinum.</div>${signInForm()}</div>`;

  const list = (arr, status) => arr.length ? `<ul>${arr.map(p => `<li class="${p.id === me ? 'me' : ''}"><span>${esc(p.name)}</span>${canEdit() ? `<span class="set"><button class="y" title="Merkja að ${esc(p.name)} mæti" aria-label="Merkja að ${esc(p.name)} mæti" data-rsvp="yes" data-ev="${esc(ev.id)}" data-pl="${esc(p.id)}" aria-pressed="${status === 'yes'}">✓</button><button class="n" title="Merkja að ${esc(p.name)} komist ekki" aria-label="Merkja að ${esc(p.name)} komist ekki" data-rsvp="no" data-ev="${esc(ev.id)}" data-pl="${esc(p.id)}" aria-pressed="${status === 'no'}">✕</button></span>` : ''}</li>`).join('')}</ul>` : '<p class="muted" style="margin:0">Enginn enn.</p>';

  const later = S.events.filter(e => e.date >= today() && e.id !== ev.id).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 5);
  return `<div class="stack">
    ${banner}
    <div class="panel">
      <div class="hero">
        <span class="soon">${soon}</span>
        <p class="date">${esc(fmtDay(ev.date))}</p>
        <div class="when">${ev.time ? `<b>kl. ${esc(fmtTime(ev.time))}</b>` : ''}${ev.time && ev.location ? ' · ' : ''}${ev.location ? esc(ev.location) : ''}</div>
        ${ev.notes ? `<div>${esc(ev.notes)}</div>` : ''}
      </div>
      ${answerBlock}
      ${S.flash ? `<div class="note warn">${esc(S.flash)}</div>` : ''}
    </div>
    <div class="panel">
      <div class="roster">
        <section><h3><b class="num">${yes.length}</b> Mæta</h3>${list(yes, 'yes')}</section>
        <section><h3><b class="num">${no.length}</b> Komast ekki</h3>${list(no, 'no')}</section>
        <section><h3><b class="num">${none.length}</b> Hafa ekki svarað</h3>${list(none, null)}</section>
      </div>
      ${players.length ? '' : `<p class="rules">Engir leikmenn skráðir enn.${canEdit() ? ' Bættu þeim við undir Deildin.' : ''}</p>`}
    </div>
    ${canEdit() ? viewReminder(ev, players, none) : ''}
    ${later.length ? `<div class="panel"><h2>Næstu kvöld</h2><div class="later">${later.map(e => {
      const n = S.attendance.filter(a => a.event_id === e.id && a.status === 'yes').length;
      const a = me ? answerOf(e.id, me) : null;
      return `<div><span><b>${esc(fmtDateLong(e.date))}</b> <span class="muted">${esc([e.time ? 'kl. ' + fmtTime(e.time) : '', e.location].filter(Boolean).join(' · '))}</span></span>
        <span class="row start" style="gap:8px"><span class="muted num">${n} ${one(n) ? 'mætir' : 'mæta'}</span>${me ? `<span class="rsvp"><button class="btn small yes" data-rsvp="yes" data-ev="${esc(e.id)}" data-pl="${esc(me)}" aria-pressed="${a === 'yes'}">Mæti</button><button class="btn small no" data-rsvp="no" data-ev="${esc(e.id)}" data-pl="${esc(me)}" aria-pressed="${a === 'no'}">Kemst ekki</button></span>` : ''}</span></div>`;
    }).join('')}</div></div>` : ''}
  </div>`;
}

// Organisers send a reminder email; each one carries personal "Ég mæti" / "Kemst ekki" links.
function viewReminder(ev, players, none) {
  const withEmail = players.filter(hasEmail);
  const unanswered = none.filter(hasEmail);
  const count = S.remindAudience === 'all' ? withEmail.length : unanswered.length;
  return `<div class="panel">
    <h2>Áminning í tölvupósti</h2>
    <p class="rules">Sendir tölvupóst um golfkvöldið ${esc(fmtDateLong(ev.date))} með tveimur hlekkjum: <b>Ég mæti</b> og <b>Kemst ekki</b>. Leikmenn þurfa ekki að skrá sig inn til að svara.</p>
    <div class="row start" role="radiogroup" aria-label="Viðtakendur">
      <label class="check" for="ra-un"><input type="radio" name="remind-aud" id="ra-un" value="unanswered" ${S.remindAudience === 'unanswered' ? 'checked' : ''}> Þeir sem hafa ekki svarað (${unanswered.length})</label>
      <label class="check" for="ra-all"><input type="radio" name="remind-aud" id="ra-all" value="all" ${S.remindAudience === 'all' ? 'checked' : ''}> Allir virkir leikmenn (${withEmail.length})</label>
    </div>
    <div class="row">
      <span class="muted">${ev.remindedAt ? 'Síðast sent ' + esc(fmtStamp(ev.remindedAt)) + '.' : 'Engin áminning send enn.'}${players.length > withEmail.length ? ` ${plural(players.length - withEmail.length, 'leikmaður er', 'leikmenn eru')} án netfangs.` : ''}</span>
      <span class="row start" style="gap:8px">
        <button class="btn" id="send-test" data-ev="${esc(ev.id)}" ${S.reminding ? 'disabled' : ''}>Senda prufu á mig</button>
        <button class="btn primary" id="send-reminder" data-ev="${esc(ev.id)}" ${S.reminding || !count ? 'disabled' : ''}>${S.reminding ? 'Sendi…' : `Senda á ${count}`}</button>
      </span>
    </div>
    ${S.remindMsg ? `<div class="note ${S.remindMsg.kind}">${esc(S.remindMsg.text)}</div>` : ''}
  </div>`;
}

/* ---------- Staðan ---------- */
function viewStandings() {
  const season = currentSeason();
  if (!season) return `<div class="panel empty"><h2>Ekkert mót valið</h2><p>${S.loaded ? 'Búðu til haust-, jóla- og vormót undir Deildin.' : 'Hleð…'}</p></div>`;
  const st = computeStandings(season, S.rounds, S.metric, standingsOpts());
  const x = Number(season.plannedRounds) || 0;
  const pct = x ? Math.min(100, Math.round(st.roundCount / x * 100)) : 0;
  const head = `
    <div class="row">
      <div class="facts">
        <div><span class="label">Hringir spilaðir</span><b class="num">${st.roundCount}${x ? ` / ${x}` : ''}</b></div>
        <div><span class="label">Gilda</span><b class="num">Bestu ${st.y}</b></div>
        <div><span class="label">Leikmenn</span><b class="num">${st.rows.length}</b></div>
      </div>
      <div class="seg" role="group" aria-label="Röðun">
        <button data-metric="points" aria-pressed="${S.metric === 'points'}">Punktar</button>
        <button data-metric="gross" aria-pressed="${S.metric === 'gross'}">Högg</button>
      </div>
    </div>
    ${x ? `<div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>` : ''}`;
  if (!st.rows.length) return `<div class="panel">${head}<div class="empty"><h2>Engir hringir enn</h2><p>Taktu mynd af Trackman-skorkortinu eftir fyrsta hringinn í ${esc(season.name)} og skráðu það hér.</p><button class="btn primary" data-go="add">Skrá skor</button></div></div>`;
  const unreg = st.rows.some(r => r.key.startsWith('card:')) && S.register;
  const rows = st.rows.map(r => `
    <tr class="${r.rank === 1 ? 'lead' : ''}">
      <td class="rank">${r.rank}</td>
      <td class="player">${esc(r.name)}${S.register && r.key.startsWith('card:') ? ' <span class="pill">Ekki tengt</span>' : ''}${!r.complete && S.metric === 'gross' ? ' <span class="pill">Vantar ' + (st.y - r.counting.length) + '</span>' : ''}</td>
      <td><div class="cards">${r.entries.map(e => e[S.metric] == null ? '' : `<span class="sc ${e.counts ? 'counts' : ''}" title="${fmtDateLong(e.date)}${e.counts ? '' : ' (gildir ekki)'}">${e[S.metric]}</span>`).join('')}</div></td>
      <td class="r num hide-sm">${r.played}</td>
      <td class="r num hide-sm">${r.best ?? '–'}</td>
      <td class="r num hide-sm">${r.avg == null ? '–' : fmtDec(r.avg)}</td>
      <td class="total num">${r.avg == null ? '–' : r.total}</td>
    </tr>`).join('');
  return `<div class="panel">${head}
    <div class="scroll"><table>
      <thead><tr><th>#</th><th>Leikmaður</th><th>Hringir (gildandi auðkenndir)</th><th class="r hide-sm">Spilað</th><th class="r hide-sm">Besti</th><th class="r hide-sm">Meðaltal</th><th class="r">${S.metric === 'points' ? 'Bestu ' + st.y + ', punktar' : 'Bestu ' + st.y + ', högg'}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${unreg ? `<div class="note">Nöfn merkt <b>Ekki tengt</b> eru Trackman-auðkenni sem eru ekki tengd skráðum leikmanni.${canWrite() ? ' <button class="btn small" data-go="league">Tengja</button>' : ''}</div>` : ''}
    <p class="rules">${S.metric === 'points'
      ? `Raðað eftir samanlögðum punktum úr ${st.y} bestu hringjum hvers leikmanns í ${esc(season.name)}. Séu leikmenn jafnir ræður besti einstaki hringurinn, síðan sá næstbesti. Yfirstrikuð skor gilda ekki.`
      : `Raðað eftir lægsta meðaltali högga í ${st.y} bestu hringjunum. Leikmenn með færri en ${st.y} hringi raðast fyrir neðan þá sem hafa náð fullum fjölda.`}</p>
  </div>`;
}

/* ---------- Skrá skor ---------- */
function playerSelect(i, pick) {
  const opts = activePlayers().map(p => `<option value="${esc(p.id)}" ${pick === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  return `<select id="s-${i}-pick" data-i="${i}" data-k="pick" class="${pick ? '' : 'unset'}" aria-label="Hver er þetta">
    <option value="" ${pick ? '' : 'selected'}>Veldu leikmann…</option>${opts}
    <option value="guest" ${pick === 'guest' ? 'selected' : ''}>Gestur (gildir ekki)</option></select>`;
}
function viewAdd() {
  if (!canWrite()) return signInPanel('skrá skor');
  const d = S.draft;
  const season = seasonForDate(S.seasons, d.date);
  const mapping = S.register && S.players.length > 0;
  const dupes = d.date ? S.rounds.filter(r => r.date === d.date && r.id !== d.id) : [];
  const photo = photoOn() ? `
    <div class="drop" id="drop">
      <div><h2>1 · Mynd af skorkorti</h2><div class="muted">Taktu mynd af Trackman-skorkortinu (eða skjámynd). Claude les nöfn, forgjöf, högg og punkta. Farðu yfir tölurnar áður en þú vistar.</div></div>
      <div class="row start">
        <label class="btn" for="photo-input">Velja myndir<input id="photo-input" type="file" accept="image/*" multiple hidden></label>
        <button class="btn primary" id="read-btn" ${S.photos.length && !S.reading ? '' : 'disabled'}>${S.reading ? 'Les skorkort…' : 'Lesa skorkort'}</button>
      </div>
      ${S.photos.length ? `<div class="thumbs">${S.photos.map(p => `<img src="${p.url}" alt="Mynd af skorkorti">`).join('')}</div>` : ''}
      ${S.readMsg ? `<div class="note ${S.readMsg.kind}">${esc(S.readMsg.text)}</div>` : ''}
    </div>` : (DEMO ? '<div class="note">Myndlestur er óvirkur í sýnishorninu. Sláðu inn Trackman-nafn eins og KIDDIEIKA66 hér fyrir neðan til að sjá það parað við leikmann.</div>' : '');
  return `<div class="panel">
    ${d.id ? `<div class="note">Þú ert að breyta hringnum frá ${fmtDateLong(d.date)}. <button class="btn small" id="cancel-edit">Hætta við</button></div>` : photo}
    <h2>${d.id ? 'Hringurinn' : (photo ? '2 · Yfirfara og vista' : 'Sláðu inn skorin')}</h2>
    <div class="grid2">
      <label class="f" for="f-date">Dagsetning<input id="f-date" type="date" value="${esc(d.date)}"></label>
      <label class="f" for="f-course">Völlur<input id="f-course" value="${esc(d.course)}" placeholder="t.d. Pebble Beach"></label>
    </div>
    <div class="note ${season ? 'ok' : 'warn'}">${season ? `Gildir í <b>${esc(season.name)}</b>.` : 'Þessi dagsetning er utan allra móta. Hringurinn vistast en gildir ekki.'}${dupes.length ? ` Hringur á þessum degi er þegar vistaður (${dupes.map(r => esc(r.course || 'enginn völlur')).join(', ')}).` : ''}</div>
    <div class="scroll"><table class="entry">
      <thead><tr><th>Nafn á skorkorti</th>${mapping ? '<th>Leikmaður</th>' : ''}<th class="r">Forgj.</th><th class="r">Högg</th><th class="r">Punktar</th><th></th></tr></thead>
      <tbody>${d.scores.map((s, i) => `<tr>
        <td class="card"><input id="s-${i}-card" data-i="${i}" data-k="card" value="${esc(s.card)}" placeholder="Trackman-nafn" autocapitalize="characters"></td>
        ${mapping ? `<td>${playerSelect(i, s.pick)}</td>` : ''}
        <td class="n"><input id="s-${i}-hcp" data-i="${i}" data-k="hcp" inputmode="decimal" value="${esc(s.hcp)}"></td>
        <td class="n"><input id="s-${i}-gross" data-i="${i}" data-k="gross" inputmode="numeric" value="${esc(s.gross)}"></td>
        <td class="n"><input id="s-${i}-points" data-i="${i}" data-k="points" inputmode="numeric" value="${esc(s.points)}"></td>
        <td><button class="btn small" data-remove="${i}" aria-label="Fjarlægja línu">✕</button></td>
      </tr>`).join('')}</tbody>
    </table></div>
    ${mapping ? `<p class="rules">Skráð Trackman-auðkenni parast sjálfkrafa. Þegar þú velur leikmann fyrir nýtt nafn er það munað næst.</p>` : ''}
    <div class="row">
      <button class="btn" id="add-row">Bæta við leikmanni</button>
      <div class="row">
        ${S.saveMsg ? `<span style="color:${S.saveMsg.kind === 'warn' ? 'var(--flag)' : 'var(--muted)'}">${esc(S.saveMsg.text)}</span>` : ''}
        <button class="btn primary" id="save-round" ${S.busy ? 'disabled' : ''}>${d.id ? 'Vista breytingar' : 'Vista hring'}</button>
      </div>
    </div>
  </div>`;
}

/* ---------- Hringir ---------- */
function viewRounds() {
  const season = currentSeason();
  const list = [...S.rounds].filter(r => !season || (r.date >= season.start && r.date <= season.end)).sort((a, b) => b.date.localeCompare(a.date));
  const outside = S.rounds.filter(r => !seasonForDate(S.seasons, r.date)).length;
  if (!list.length) return `<div class="panel empty"><h2>Engir hringir í ${esc(season?.name || 'þessu móti')}</h2><button class="btn primary" data-go="add">Skrá skor</button></div>`;
  const idx = aliasIndex();
  return `<div class="panel">
    <div class="row"><h2>${esc(season?.name || 'Allir hringir')} · ${plural(list.length, 'hringur', 'hringir')}</h2></div>
    ${list.map(r => {
      const sc = [...(r.scores || [])].sort((a, b) => (Number(b.points) || 0) - (Number(a.points) || 0));
      return `<div class="round">
        <div class="row"><div><b>${fmtDateLong(r.date)}</b> <span class="muted">${esc(r.course || '')}</span></div>
        ${canWrite() ? `<div class="row">${S.confirmDelete === r.id
          ? `<span class="muted">Eyða þessum hring?</span><button class="btn small danger" data-del-yes="${esc(r.id)}">Eyða</button><button class="btn small" data-del-no>Halda</button>`
          : `<button class="btn small" data-edit="${esc(r.id)}">Breyta</button><button class="btn small danger" data-del="${esc(r.id)}">Eyða</button>`}</div>` : ''}</div>
        <div class="who">${sc.map(s => { const p = s.guest ? null : playerForScore(s, idx); return `<span>${esc(p?.name || s.card_name || s.player)}${s.guest ? ' <span class="pill">Gestur</span>' : ''} <b>${s.points ?? '–'}</b><span class="muted"> pkt · ${s.gross ?? '–'} högg</span></span>`; }).join('')}</div>
      </div>`;
    }).join('')}
    ${outside ? `<p class="rules">${outside} ${one(outside) ? 'vistaður hringur er' : 'vistaðir hringir eru'} utan dagsetninga allra móta.</p>` : ''}
  </div>`;
}

/* ---------- Deildin: leikmenn, golfkvöld, mót ---------- */
function viewLeague() {
  return `<div class="stack">${S.register ? viewPlayers() + viewEvents() : registerMissing()}${viewSettings()}</div>`;
}

function viewPlayers() {
  const e = S.editPlayer;
  const unmatched = canWrite() ? unmatchedCardNames() : [];
  const roundsFor = p => S.rounds.filter(r => (r.scores || []).some(s => !s.guest && playerForScore(s)?.id === p.id)).length;
  const emailOf = p => S.accounts.find(a => a.player_id === p.id)?.email || '';
  const adminOf = p => !!S.accounts.find(a => a.player_id === p.id)?.is_admin;
  const form = e ? `<div class="panel">
      <h2>${e.id ? 'Breyta: ' + esc(e.name || 'leikmaður') : 'Skrá leikmann'}</h2>
      <div class="grid2">
        <label class="f" for="p-name">Nafn<input id="p-name" value="${esc(e.name)}" placeholder="t.d. Jón Ingi Björnsson"></label>
        <label class="f" for="p-ids">Trackman-auðkenni<input id="p-ids" value="${esc(e.ids)}" placeholder="t.d. KIDDIEIKA66, JONINGI"></label>
        <label class="f" for="p-email">Netfang til innskráningar (valfrjálst)<input id="p-email" type="email" value="${esc(e.email)}" placeholder="Þarf fyrir áminningar og innskráningu"></label>
      </div>
      <div class="row start">
        <label class="check" for="p-admin"><input id="p-admin" type="checkbox" ${e.admin ? 'checked' : ''}> Umsjónarmaður (sér um leikmenn, golfkvöld og mót)</label>
        <label class="check" for="p-active"><input id="p-active" type="checkbox" ${e.active ? 'checked' : ''}> Virkur í vetur</label>
      </div>
      <p class="rules">Trackman-auðkenni eru nöfnin sem leikmaðurinn birtist undir á skorkortum. Aðskildu mörg með kommum. Löng nöfn sem styttast með „...“ á kortinu parast samt.</p>
      <div class="row"><span id="p-msg" style="color:var(--flag)"></span><div class="row">
        ${e.id ? (S.confirmDelete === 'player:' + e.id ? `<span class="muted">Fjarlægja ${esc(e.name)}? Skorin haldast en verða ekki tengd.</span><button class="btn danger" id="p-del-yes">Fjarlægja</button>` : `<button class="btn danger" id="p-del">Fjarlægja</button>`) : ''}
        <button class="btn" id="p-cancel">Hætta við</button><button class="btn primary" id="p-save" ${S.busy ? 'disabled' : ''}>Vista</button></div></div>
    </div>` : '';
  const players = [...S.players].sort((a, b) => (b.active - a.active) || a.name.localeCompare(b.name, LOCALE));
  return `${form}<div class="panel">
    <div class="row"><h2>Leikmenn · ${S.players.filter(p => p.active).length}</h2>${canEdit() && !e ? '<button class="btn" id="p-new">Skrá leikmann</button>' : ''}</div>
    ${players.length ? `<div class="scroll"><table>
      <thead><tr><th>Nafn</th><th>Trackman-auðkenni</th>${canEdit() && !DEMO ? '<th class="hide-sm">Netfang</th>' : ''}<th class="r hide-sm">Hringir</th><th></th></tr></thead>
      <tbody>${players.map(p => `<tr>
        <td class="player">${esc(p.name)}${p.active ? '' : ' <span class="pill">Óvirkur</span>'}${adminOf(p) ? ' <span class="pill">Umsjón</span>' : ''}</td>
        <td><div class="tms">${p.ids.length ? p.ids.map(t => `<span class="tm">${esc(t)}</span>`).join('') : '<span class="muted">Ekkert enn</span>'}</div></td>
        ${canEdit() && !DEMO ? `<td class="hide-sm">${emailOf(p) ? esc(emailOf(p)) : '<span class="muted">Ekkert netfang</span>'}</td>` : ''}
        <td class="r num hide-sm">${roundsFor(p)}</td>
        <td class="r">${canEdit() ? `<button class="btn small" data-eplayer="${esc(p.id)}">Breyta</button>` : ''}</td>
      </tr>`).join('')}</tbody></table></div>` : `<p class="muted" style="margin:0">Engir leikmenn skráðir enn.</p>`}
  </div>
  ${unmatched.length ? `<div class="panel">
    <h2>Nöfn á skorkortum sem þarf að tengja</h2>
    <p class="rules">Þessi nöfn birtast á vistuðum skorkortum en tilheyra engum skráðum leikmanni. Tengdu hvert þeirra einu sinni; þá gilda fyrri og síðari hringir fyrir þann leikmann.</p>
    <div class="scroll"><table><tbody>${unmatched.map((u, i) => `<tr>
      <td><span class="tm">${esc(u.name)}</span></td><td class="muted num hide-sm">${u.count} skor</td>
      <td><select id="link-${i}" aria-label="Leikmaður fyrir ${esc(u.name)}"><option value="">Veldu leikmann…</option>${activePlayers().map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></td>
      <td class="r"><button class="btn small" data-link="${i}" data-card="${esc(u.name)}">Tengja</button></td></tr>`).join('')}</tbody></table></div>
  </div>` : ''}`;
}

function viewEvents() {
  const e = S.editEvent;
  const t = today();
  const upcoming = S.events.filter(x => x.date >= t).sort((a, b) => a.date.localeCompare(b.date));
  const past = S.events.filter(x => x.date < t).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8);
  const count = id => S.attendance.filter(a => a.event_id === id && a.status === 'yes').length;
  const row = x => `<tr><td class="player">${esc(fmtDateLong(x.date))}</td><td class="num">${esc(fmtTime(x.time)) || '<span class="muted">–</span>'}</td><td>${esc(x.location)}</td><td class="r num">${count(x.id)}</td>
    <td class="r">${canEdit() ? `<button class="btn small" data-eevent="${esc(x.id)}">Breyta</button>` : ''}</td></tr>`;
  const form = e ? `<div class="panel">
      <h2>${e.id ? 'Breyta golfkvöldi' : 'Bæta við golfkvöldum'}</h2>
      <div class="grid2">
        <label class="f" for="v-date">Dagsetning<input id="v-date" type="date" value="${esc(e.date)}"></label>
        <label class="f" for="v-time">Hefst<input id="v-time" type="time" value="${esc(fmtTime(e.time))}"></label>
        <label class="f" for="v-loc">Hvar<input id="v-loc" value="${esc(e.location)}" placeholder="t.d. GKG, básar 1–4"></label>
        ${e.id ? '' : `<label class="f" for="v-until">Endurtaka vikulega til (valfrjálst)<input id="v-until" type="date" value="${esc(e.until)}"></label>`}
      </div>
      <label class="f" for="v-notes">Athugasemd (valfrjálst)<input id="v-notes" value="${esc(e.notes)}" placeholder="t.d. Mætum 10 mínútum fyrr"></label>
      <div class="row"><span id="v-msg" style="color:var(--flag)"></span><div class="row">
        ${e.id ? (S.confirmDelete === 'event:' + e.id ? `<span class="muted">Eyða þessu kvöldi og svörunum?</span><button class="btn danger" id="v-del-yes">Eyða</button>` : `<button class="btn danger" id="v-del">Eyða</button>`) : ''}
        <button class="btn" id="v-cancel">Hætta við</button><button class="btn primary" id="v-save" ${S.busy ? 'disabled' : ''}>Vista</button></div></div>
    </div>` : '';
  return `${form}<div class="panel">
    <div class="row"><h2>Golfkvöld</h2>${canEdit() && !e ? '<button class="btn" id="v-new">Bæta við golfkvöldum</button>' : ''}</div>
    ${upcoming.length ? `<div class="scroll"><table><thead><tr><th>Dagsetning</th><th>Hefst</th><th>Hvar</th><th class="r">Mæta</th><th></th></tr></thead><tbody>${upcoming.map(row).join('')}</tbody></table></div>`
      : `<p class="muted" style="margin:0">Engin væntanleg kvöld.${canEdit() ? ' Bættu við einu, eða vikulegri röð, með hnappinum hér fyrir ofan.' : ''}</p>`}
    ${past.length ? `<details><summary>Liðin kvöld</summary><div class="scroll"><table><tbody>${past.map(row).join('')}</tbody></table></div></details>` : ''}
    <p class="rules">Næsta kvöld frá og með deginum í dag birtist á síðunni Næsti hringur.</p>
  </div>`;
}

function viewSettings() {
  const list = sortedSeasons();
  const e = S.editSeason;
  const form = e ? `<div class="panel">
      <h2>${e.id ? 'Breyta: ' + esc(e.name) : 'Nýtt mót'}</h2>
      <div class="grid2">
        <label class="f" for="e-name">Heiti<input id="e-name" value="${esc(e.name)}" placeholder="t.d. Haustmót 2026"></label>
        <label class="f" for="e-start">Hefst<input id="e-start" type="date" value="${esc(e.start)}"></label>
        <label class="f" for="e-end">Lýkur<input id="e-end" type="date" value="${esc(e.end)}"></label>
        <label class="f" for="e-planned">Fjöldi hringja (x)<input id="e-planned" type="number" min="1" value="${esc(e.plannedRounds)}"></label>
        <label class="f" for="e-best">Bestu hringir sem gilda (y)<input id="e-best" type="number" min="1" value="${esc(e.bestOf)}"></label>
      </div>
      <div class="row"><span id="e-msg" style="color:var(--flag)"></span><div class="row">
        ${e.id ? (S.confirmDelete === 'season:' + e.id ? `<span class="muted">Fjarlægja mótið? Hringirnir haldast vistaðir.</span><button class="btn danger" id="e-del-yes">Fjarlægja</button>` : `<button class="btn danger" id="e-del">Fjarlægja</button>`) : ''}
        <button class="btn" id="e-cancel">Hætta við</button><button class="btn primary" id="e-save">Vista</button></div></div>
    </div>` : '';
  return `${form}<div class="panel">
    <div class="row"><h2>Mót vetrarins</h2>${canEdit() && !e ? '<button class="btn" id="e-new">Nýtt mót</button>' : ''}</div>
    <div class="scroll"><table>
      <thead><tr><th>Mót</th><th>Dagsetningar</th><th class="r">Spilað</th><th class="r">Hringir (x)</th><th class="r">Gilda (y)</th><th></th></tr></thead>
      <tbody>${list.map(s => {
        const played = S.rounds.filter(r => r.date >= s.start && r.date <= s.end).length;
        return `<tr><td class="player">${esc(s.name)}</td><td class="num">${fmtDate(s.start)} – ${fmtDate(s.end)}</td><td class="r num">${played}</td><td class="r num">${s.plannedRounds ?? '–'}</td><td class="r num">${s.bestOf}</td>
        <td class="r">${canEdit() ? `<button class="btn small" data-eseason="${esc(s.id)}">Breyta</button>` : ''}</td></tr>`;
      }).join('') || '<tr><td colspan="6" class="muted">Ekkert enn.</td></tr>'}</tbody>
    </table></div>
    <p class="rules">Hvert mót byrjar frá núlli. Hringur tilheyrir mótinu sem nær yfir dagsetningu hans.${canEdit() ? '' : ' Aðeins umsjónarmenn geta breytt þessu.'}</p>
  </div>`;
}

/* ---------- clicks ---------- */
document.addEventListener('click', async ev => {
  const t = ev.target.closest('button, [data-go]');
  if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.confirmDelete = null; S.flash = null; render(); return; }
  if (t.dataset.go) { S.tab = t.dataset.go; render(); return; }
  if (t.id === 'go-signin') { S.tab = 'next'; render(); focus('#signin-email'); return; }
  if (t.dataset.season) { S.seasonId = t.dataset.season; render(); return; }
  if (t.dataset.metric) { S.metric = t.dataset.metric; render(); return; }
  if (t.dataset.rsvp) return setAnswer(t.dataset.ev, t.dataset.pl, t.dataset.rsvp);
  if (t.id === 'send-reminder') return sendReminder(t.dataset.ev, S.remindAudience);
  if (t.id === 'send-test') return sendReminder(t.dataset.ev, 'me');
  if (t.id === 'sign-out') { await S.sb.auth.signOut(); return; }
  if (t.id === 'add-row') { S.draft.scores.push(blankScore()); render(); focus(`#s-${S.draft.scores.length - 1}-card`); return; }
  if (t.dataset.remove != null) { S.draft.scores.splice(Number(t.dataset.remove), 1); if (!S.draft.scores.length) S.draft.scores.push(blankScore()); render(); return; }
  if (t.id === 'read-btn') return readScorecard();
  if (t.id === 'save-round') return saveRound();
  if (t.id === 'cancel-edit') { S.draft = newDraft(); S.saveMsg = null; render(); return; }
  if (t.dataset.edit) {
    const r = S.rounds.find(x => x.id === t.dataset.edit); if (!r) return;
    const idx = aliasIndex();
    S.draft = { id: r.id, date: r.date, course: r.course || '', scores: (r.scores || []).map(s => ({
      card: s.card_name ?? s.player ?? '', pick: s.guest ? 'guest' : (playerForScore(s, idx)?.id || ''),
      hcp: s.hcp ?? '', gross: s.gross ?? '', points: s.points ?? '' })) };
    S.saveMsg = null; S.tab = 'add'; render(); return;
  }
  if (t.dataset.del) { S.confirmDelete = t.dataset.del; render(); return; }
  if (t.dataset.delNo != null) { S.confirmDelete = null; render(); return; }
  if (t.dataset.delYes) {
    const id = t.dataset.delYes;
    if (DEMO) S.rounds = S.rounds.filter(r => r.id !== id);
    else { const { error } = await S.sb.from('rounds').delete().eq('id', id); if (error) console.warn(error); await loadAll(); }
    S.confirmDelete = null; render(); return;
  }
  if (t.dataset.link != null) return linkCardName(t.dataset.card, $('#link-' + t.dataset.link)?.value);
  // Leikmenn
  if (t.id === 'p-new') { S.editPlayer = { id: null, name: '', ids: '', email: '', admin: false, active: true }; S.confirmDelete = null; render(); focus('#p-name'); return; }
  if (t.dataset.eplayer) {
    const p = playerById(t.dataset.eplayer); const acc = S.accounts.find(a => a.player_id === p.id);
    S.editPlayer = { id: p.id, name: p.name, ids: p.ids.join(', '), email: acc?.email || '', origEmail: acc?.email || '', admin: !!acc?.is_admin, active: p.active };
    S.confirmDelete = null; render(); window.scrollTo({ top: 0 }); return;
  }
  if (t.id === 'p-cancel') { S.editPlayer = null; S.confirmDelete = null; render(); return; }
  if (t.id === 'p-save') return savePlayer();
  if (t.id === 'p-del') { S.confirmDelete = 'player:' + S.editPlayer.id; render(); return; }
  if (t.id === 'p-del-yes') return deletePlayer();
  // Golfkvöld
  if (t.id === 'v-new') {
    const last = [...S.events].sort((a, b) => b.date.localeCompare(a.date))[0];
    const base = last && last.date >= today() ? addDays(last.date, 7) : today();
    S.editEvent = { id: null, date: base, time: last?.time || '', location: last?.location || '', notes: '', until: '' };
    S.confirmDelete = null; render(); return;
  }
  if (t.dataset.eevent) { S.editEvent = { ...S.events.find(x => x.id === t.dataset.eevent), until: '' }; S.confirmDelete = null; render(); window.scrollTo({ top: 0 }); return; }
  if (t.id === 'v-cancel') { S.editEvent = null; S.confirmDelete = null; render(); return; }
  if (t.id === 'v-save') return saveEvent();
  if (t.id === 'v-del') { S.confirmDelete = 'event:' + S.editEvent.id; render(); return; }
  if (t.id === 'v-del-yes') return deleteEvent();
  // Mót
  if (t.id === 'e-new') {
    const last = sortedSeasons().slice(-1)[0];
    S.editSeason = { id: null, name: '', start: last ? addDays(last.end, 1) : today(), end: '', plannedRounds: 8, bestOf: 5 }; render(); return;
  }
  if (t.dataset.eseason) { const s = S.seasons.find(x => x.id === t.dataset.eseason); S.editSeason = { ...s }; S.confirmDelete = null; render(); return; }
  if (t.id === 'e-cancel') { S.editSeason = null; S.confirmDelete = null; render(); return; }
  if (t.id === 'e-save') return saveSeason();
  if (t.id === 'e-del') { S.confirmDelete = 'season:' + S.editSeason.id; render(); return; }
  if (t.id === 'e-del-yes') {
    const id = S.editSeason.id;
    if (DEMO) S.seasons = S.seasons.filter(s => s.id !== id);
    else { const { error } = await S.sb.from('seasons').delete().eq('id', id); if (error) { $('#e-msg').textContent = 'Ekki tókst að fjarlægja mótið.'; return; } await loadAll(); }
    S.editSeason = null; S.confirmDelete = null; afterLoad(); return;
  }
});

document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'signin-form') return;
  ev.preventDefault();
  const email = $('#signin-email').value.trim();
  if (!email) return;
  S.signinBusy = true; S.signinMsg = null; render();
  const { error } = await S.sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
  S.signinBusy = false;
  S.signinMsg = error
    ? { kind: 'warn', text: /rate/i.test(error.message) ? 'Of margir innskráningarpóstar hafa verið sendir nýlega. Bíddu í nokkrar mínútur og reyndu aftur.' : 'Ekki tókst að senda póstinn. Athugaðu netfangið og reyndu aftur.' }
    : { kind: 'ok', text: `Athugaðu póstinn á ${email} og opnaðu hlekkinn í þessu tæki.` };
  render();
});

document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.k) {
    const row = S.draft.scores[Number(el.dataset.i)];
    row[el.dataset.k] = el.value;
    if (el.dataset.k === 'pick') el.classList.toggle('unset', !el.value);
    return;
  }
  if (el.id === 'f-course') { S.draft.course = el.value; return; }
  const sk = { 'e-name': 'name', 'e-start': 'start', 'e-end': 'end', 'e-planned': 'plannedRounds', 'e-best': 'bestOf' }[el.id];
  if (sk) { S.editSeason[sk] = el.value; return; }
  const pk = { 'p-name': 'name', 'p-ids': 'ids', 'p-email': 'email' }[el.id];
  if (pk) { S.editPlayer[pk] = el.value; return; }
  const vk = { 'v-date': 'date', 'v-time': 'time', 'v-loc': 'location', 'v-notes': 'notes', 'v-until': 'until' }[el.id];
  if (vk) { S.editEvent[vk] = el.value; return; }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'f-date') { S.draft.date = el.value; render(); }
  if (el.id === 'photo-input') addPhotos(el.files);
  if (el.id === 'p-admin') S.editPlayer.admin = el.checked;
  if (el.id === 'p-active') S.editPlayer.active = el.checked;
  if (el.name === 'remind-aud') { S.remindAudience = el.value; S.remindMsg = null; render(); }
  // Typing a Trackman name picks the registered player it belongs to.
  if (el.dataset.k === 'card') {
    const row = S.draft.scores[Number(el.dataset.i)];
    const p = findPlayer(el.value);
    if (p && !row.pick) { row.pick = p.id; render(); }
  }
});
document.addEventListener('dragover', ev => { const d = ev.target.closest?.('#drop'); if (d) { ev.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', ev => { const d = ev.target.closest?.('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', ev => { const d = ev.target.closest?.('#drop'); if (d) { ev.preventDefault(); addPhotos(ev.dataTransfer.files); } });

function focus(sel) { requestAnimationFrame(() => $(sel)?.focus()); }

/* ---------- mæting ---------- */
async function setAnswer(eventId, playerId, status) {
  if (!eventId || !playerId || S.busy) return;
  const current = answerOf(eventId, playerId);
  const clear = current === status; // tapping the same answer again clears it
  S.flash = null; S.linkMsg = null;
  if (DEMO) {
    S.attendance = S.attendance.filter(a => !(a.event_id === eventId && a.player_id === playerId));
    if (!clear) S.attendance.push({ event_id: eventId, player_id: playerId, status });
    render(); return;
  }
  S.busy = true; render();
  const q = clear
    ? S.sb.from('attendance').delete().eq('event_id', eventId).eq('player_id', playerId).select()
    : S.sb.from('attendance').upsert({ event_id: eventId, player_id: playerId, status, updated_at: new Date().toISOString() }, { onConflict: 'event_id,player_id' }).select();
  const { data, error } = await q;
  S.busy = false;
  if (error || !data?.length) { console.warn(error); S.flash = 'Svarið vistaðist ekki. Skráðu þig inn aftur og reyndu á ný.'; render(); return; }
  S.attendance = S.attendance.filter(a => !(a.event_id === eventId && a.player_id === playerId));
  if (!clear) S.attendance.push({ event_id: eventId, player_id: playerId, status });
  render();
}

// Answering from the reminder email: the link carries a signed token, so no sign-in is needed.
// The answer is only recorded once this script runs, so mail scanners that open links don't answer.
async function answerFromLink() {
  const token = PARAMS.get('svar'), s = PARAMS.get('s');
  if (!token || !['ja', 'nei'].includes(s)) return;
  history.replaceState(null, '', location.pathname);
  S.linkMsg = { kind: '', text: 'Skrái svarið…' }; render();
  const { data, error } = await S.sb.functions.invoke('rsvp', { body: { token, status: s === 'ja' ? 'yes' : 'no' } });
  if (error || !data?.ok) {
    let msg = 'Ekki tókst að skrá svarið úr tölvupóstinum. Skráðu þig inn og svaraðu hér.';
    try { const b = await error?.context?.json(); if (b?.error) msg = b.error; } catch {}
    S.linkMsg = { kind: 'warn', text: msg };
  } else {
    const first = String(data.name || '').split(' ')[0];
    S.linkMsg = { kind: 'ok', text: `Takk${first ? ' ' + first : ''}! Svarið þitt fyrir golfkvöldið ${fmtDate(data.event_date)} er skráð: ${data.status === 'yes' ? 'Ég mæti' : 'Kemst ekki'}.` };
    await loadAll();
  }
  S.tab = 'next'; render();
}

async function sendReminder(eventId, audience) {
  if (S.reminding) return;
  S.remindMsg = null;
  if (DEMO) { S.remindMsg = { kind: 'ok', text: 'Í sýnishorninu er enginn póstur sendur.' }; render(); return; }
  S.reminding = true; render();
  const { data, error } = await S.sb.functions.invoke('send-reminders', { body: { event_id: eventId, audience } });
  S.reminding = false;
  if (error) {
    let msg = 'Ekki tókst að senda áminninguna.';
    try { const b = await error.context.json(); if (b?.error) msg = b.error; } catch {}
    S.remindMsg = { kind: 'warn', text: msg };
  } else {
    S.remindMsg = audience === 'me'
      ? (data.sent ? { kind: 'ok', text: `Prufupóstur sendur á ${S.session?.user?.email}. Hlekkirnir í honum skrá raunverulegt svar þitt.` } : { kind: 'warn', text: 'Prufupósturinn fór ekki. Athugaðu stillingar Brevo.' })
      : { kind: data.failed ? 'warn' : 'ok', text: `Áminning send á ${plural(data.sent, 'leikmann', 'leikmenn')}.${data.failed ? ` ${data.failed} ${one(data.failed) ? 'sending mistókst' : 'sendingar mistókust'}.` : ''}` };
    await loadAll();
  }
  render();
}

/* ---------- myndir ---------- */
function addPhotos(files) {
  const imgs = [...(files || [])].filter(f => f.type.startsWith('image/'));
  if (!imgs.length) return;
  S.photos.forEach(p => URL.revokeObjectURL(p.url));
  S.photos = imgs.slice(0, 4).map(f => ({ file: f, url: URL.createObjectURL(f) }));
  S.readMsg = null; render();
}

// Shrink a phone photo to at most 1600px on its long side as JPEG, so uploads stay small.
async function toJpegBase64(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => null);
  if (!bmp) throw new Error('decode');
  const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85).split(',')[1];
}

/* ---------- Claude les skorkortið (read-scorecard) ---------- */
async function readScorecard() {
  if (!S.photos.length) return;
  S.reading = true; S.readMsg = { kind: '', text: 'Les skorkortið. Það getur tekið allt að mínútu.' }; render();
  try {
    let images;
    try { images = await Promise.all(S.photos.map(async p => ({ media_type: 'image/jpeg', data: await toJpegBase64(p.file) }))); }
    catch { throw { friendly: 'Ekki tókst að opna myndina. Prófaðu JPEG eða PNG.' }; }
    const { data, error } = await S.sb.functions.invoke('read-scorecard', { body: { images } });
    if (error) {
      let msg = 'Myndlesarinn er ekki tiltækur. Sláðu skorin inn handvirkt.';
      try { const b = await error.context.json(); if (b?.error) msg = b.error; } catch {}
      throw { friendly: msg };
    }
    const ps = Array.isArray(data?.players) ? data.players : [];
    if (!ps.length) throw { friendly: 'Engin skor fundust á myndinni. Prófaðu skýrari mynd tekna beint að kortinu, eða sláðu skorin inn.' };
    const clean = v => (v === null || v === undefined || v === '') ? '' : String(v);
    const idx = aliasIndex();
    S.draft.scores = ps.map(p => {
      const card = String(p.player ?? '').trim();
      return { card, pick: findPlayer(card, idx)?.id || '', hcp: clean(p.hcp), gross: clean(p.gross), points: clean(p.points) };
    });
    if (data.course && !S.draft.course) S.draft.course = String(data.course);
    if (/^\d{4}-\d{2}-\d{2}$/.test(data.date || '')) S.draft.date = data.date;
    const unsure = Array.isArray(data.uncertain) && data.uncertain.length ? ' Athugaðu: ' + data.uncertain.join('; ') + '.' : '';
    const missing = S.draft.scores.some(s => s.points === '') ? ' Punkta vantaði á kortið fyrir suma; fylltu þá inn.' : '';
    const unlinked = S.register && S.players.length ? S.draft.scores.filter(s => !s.pick).length : 0;
    const link = unlinked ? (one(unlinked) ? ` ${unlinked} nafn er ekki tengt leikmanni; veldu hver það er.` : ` ${unlinked} nöfn eru ekki tengd leikmönnum; veldu hverjir það eru.`) : '';
    S.readMsg = { kind: unsure || missing || link ? 'warn' : 'ok', text: `Fann ${plural(ps.length, 'leikmann', 'leikmenn')}. Berðu allar tölur saman við kortið áður en þú vistar.${link}${unsure}${missing}` };
  } catch (e) {
    console.warn(e);
    S.readMsg = { kind: 'warn', text: e?.friendly || 'Lestur mistókst. Reyndu aftur eða sláðu skorin inn handvirkt.' };
  }
  S.reading = false; render();
}

/* ---------- vista hringi ---------- */
async function saveRound() {
  const d = S.draft;
  const mapping = S.register && S.players.length > 0;
  const rows = d.scores.filter(s => String(s.card).trim() || s.pick && s.pick !== 'guest');
  const fail = text => { S.saveMsg = { kind: 'warn', text }; render(); };
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date)) return fail('Veldu dagsetningu hringsins.');
  if (!rows.length) return fail('Bættu við að minnsta kosti einum leikmanni.');
  if (mapping && rows.some(s => !s.pick)) return fail('Veldu hver hvert nafn á skorkortinu er, eða merktu sem gest.');
  if (rows.some(s => num(s.points) == null && num(s.gross) == null)) return fail('Hver leikmaður þarf punkta eða högg.');
  const ids = rows.map(s => s.pick).filter(p => p && p !== 'guest');
  if (new Set(ids).size !== ids.length) return fail('Leikmaður er skráður tvisvar.');
  const cards = rows.map(s => normCardName(s.card)).filter(Boolean);
  if (!mapping && new Set(cards).size !== cards.length) return fail('Leikmaður er skráður tvisvar.');

  const scores = rows.map(s => {
    const card = String(s.card).trim();
    const p = s.pick && s.pick !== 'guest' ? playerById(s.pick) : null;
    const out = { player: p?.name || card, card_name: card || null, player_id: p?.id || null, hcp: num(s.hcp), gross: num(s.gross), points: num(s.points) };
    if (s.pick === 'guest') out.guest = true;
    return out;
  });
  const round = { id: d.id, date: d.date, course: d.course.trim(), scores };
  S.busy = true; render();
  // Remember new Trackman names so the next scorecard matches by itself.
  const learn = rows.filter(s => s.pick && s.pick !== 'guest' && normCardName(s.card) && findPlayer(s.card)?.id !== s.pick);
  let clash = [];
  if (DEMO) {
    for (const s of learn) { const p = playerById(s.pick); if (!aliasIndex().has(normCardName(s.card))) p.ids.push(normCardName(s.card)); else clash.push(s.card); }
    if (d.id) S.rounds = S.rounds.map(r => r.id === d.id ? round : r);
    else S.rounds.push({ ...round, id: 'demo-' + Date.now() });
  } else {
    const q = d.id ? S.sb.from('rounds').update(toRound(round)).eq('id', d.id).select() : S.sb.from('rounds').insert(toRound(round)).select();
    const { data, error } = await q;
    if (error || !data?.length) { S.busy = false; console.warn(error); return fail(error ? 'Ekki tókst að vista. Athugaðu nettenginguna og reyndu aftur.' : 'Ekki vistað: aðgangurinn þinn má ekki breyta hringjum.'); }
    for (const s of learn) {
      const { data: ok, error: e2 } = await S.sb.rpc('add_trackman_id', { p_player: s.pick, p_card_name: s.card });
      if (e2 || ok === false) clash.push(s.card);
    }
    await loadAll();
  }
  S.busy = false;
  const season = seasonForDate(S.seasons, d.date);
  S.photos.forEach(p => URL.revokeObjectURL(p.url));
  S.photos = []; S.readMsg = null; S.draft = newDraft();
  S.saveMsg = { kind: clash.length ? 'warn' : 'ok', text: clash.length ? `Hringurinn var vistaður. ${clash.join(', ')} tilheyrir öðrum leikmanni og var ekki bætt við skrána.` : 'Hringurinn var vistaður.' };
  if (season && !clash.length) { S.seasonId = season.id; S.tab = 'standings'; }
  render();
}

async function linkCardName(card, playerId) {
  if (!playerId) return;
  if (DEMO) { playerById(playerId).ids.push(normCardName(card)); render(); return; }
  const { data, error } = await S.sb.rpc('add_trackman_id', { p_player: playerId, p_card_name: card });
  if (error || data === false) console.warn(error || 'already linked');
  await loadAll();
}

/* ---------- vista leikmenn (umsjón) ---------- */
async function savePlayer() {
  const e = S.editPlayer;
  const msg = t => { const m = $('#p-msg'); if (m) m.textContent = t; };
  const name = String(e.name).trim();
  const ids = [...new Set(String(e.ids).split(',').map(normCardName).filter(Boolean))];
  const email = String(e.email).trim().toLowerCase();
  if (!name) return msg('Gefðu leikmanninum nafn.');
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return msg('Athugaðu netfangið.');
  const taken = ids.find(t => { const p = aliasIndex().get(t); return p && p.id !== e.id && p.ids.map(normCardName).includes(t); });
  if (taken) return msg(`${taken} tilheyrir þegar ${aliasIndex().get(taken).name}.`);
  const meEmail = S.session?.user?.email?.toLowerCase();
  if (!DEMO && e.origEmail && e.origEmail.toLowerCase() === meEmail && (!e.admin || email !== meEmail)) return msg('Þú getur ekki fjarlægt eigin umsjónarréttindi eða breytt eigin netfangi hér.');
  if (DEMO) {
    if (e.id) Object.assign(playerById(e.id), { name, ids, active: e.active });
    else S.players.push({ id: 'demo-p' + Date.now(), name, ids, active: e.active });
    S.editPlayer = null; render(); return;
  }
  S.busy = true; render();
  const body = { name, trackman_ids: ids, active: !!e.active };
  const q = e.id ? S.sb.from('players').update(body).eq('id', e.id).select() : S.sb.from('players').insert(body).select();
  const { data, error } = await q;
  if (error || !data?.length) { S.busy = false; render(); return msg('Ekki vistað. Aðeins umsjónarmenn geta skráð leikmenn.'); }
  const pid = data[0].id;
  // Sign-in email lives in members (never public).
  let accErr = null;
  if (e.origEmail && e.origEmail.toLowerCase() !== email) {
    ({ error: accErr } = await S.sb.from('members').delete().eq('email', e.origEmail));
  }
  if (!accErr && email) {
    ({ error: accErr } = await S.sb.from('members').upsert({ email, name, is_admin: !!e.admin, player_id: pid }, { onConflict: 'email' }));
  }
  S.busy = false;
  await Promise.all([loadAll(), loadAccounts()]);
  if (accErr) { console.warn(accErr); S.editPlayer = { ...e, id: pid }; render(); return msg(/duplicate|unique/i.test(accErr.message) ? 'Þetta netfang er þegar tengt öðrum leikmanni.' : 'Leikmaðurinn var vistaður en netfangið ekki.'); }
  S.editPlayer = null; render();
}

async function deletePlayer() {
  const id = S.editPlayer.id;
  if (DEMO) { S.players = S.players.filter(p => p.id !== id); S.attendance = S.attendance.filter(a => a.player_id !== id); }
  else {
    const acc = S.accounts.find(a => a.player_id === id);
    if (acc && acc.email.toLowerCase() === S.session?.user?.email?.toLowerCase()) { $('#p-msg').textContent = 'Þú getur ekki fjarlægt eigin aðgang.'; return; }
    if (acc) await S.sb.from('members').delete().eq('email', acc.email);
    const { error } = await S.sb.from('players').delete().eq('id', id);
    if (error) { $('#p-msg').textContent = 'Ekki tókst að fjarlægja leikmanninn.'; return; }
    await Promise.all([loadAll(), loadAccounts()]);
  }
  S.editPlayer = null; S.confirmDelete = null; render();
}

/* ---------- vista golfkvöld (umsjón) ---------- */
async function saveEvent() {
  const e = S.editEvent;
  const msg = t => { $('#v-msg').textContent = t; };
  if (!/^\d{4}-\d{2}-\d{2}$/.test(e.date || '')) return msg('Veldu dagsetningu.');
  let dates = [e.date];
  if (!e.id && e.until) {
    if (e.until < e.date) return msg('„Endurtaka til“ er á undan fyrstu dagsetningunni.');
    dates = [];
    for (let d = e.date; d <= e.until && dates.length < 40; d = addDays(d, 7)) dates.push(d);
  }
  const base = { time: e.time || null, location: String(e.location || '').trim(), notes: String(e.notes || '').trim() };
  if (DEMO) {
    if (e.id) Object.assign(S.events.find(x => x.id === e.id), { date: e.date, ...base });
    else dates.forEach((d, i) => S.events.push({ id: 'demo-e' + Date.now() + i, date: d, ...base }));
    S.editEvent = null; render(); return;
  }
  S.busy = true; render();
  const q = e.id
    ? S.sb.from('events').update(toEvent({ date: e.date, ...base })).eq('id', e.id).select()
    : S.sb.from('events').insert(dates.map(d => toEvent({ date: d, ...base }))).select();
  const { data, error } = await q;
  S.busy = false;
  if (error || !data?.length) { render(); return msg('Ekki vistað. Aðeins umsjónarmenn geta skipulagt golfkvöld.'); }
  S.editEvent = null; await loadAll();
}

async function deleteEvent() {
  const id = S.editEvent.id;
  if (DEMO) { S.events = S.events.filter(x => x.id !== id); S.attendance = S.attendance.filter(a => a.event_id !== id); }
  else { const { error } = await S.sb.from('events').delete().eq('id', id); if (error) { $('#v-msg').textContent = 'Ekki tókst að eyða kvöldinu.'; return; } await loadAll(); }
  S.editEvent = null; S.confirmDelete = null; render();
}

/* ---------- vista mót (umsjón) ---------- */
async function saveSeason() {
  const e = S.editSeason;
  const msg = t => { $('#e-msg').textContent = t; };
  const s = { id: e.id, name: String(e.name).trim(), start: e.start, end: e.end, plannedRounds: Number(e.plannedRounds) || null, bestOf: Number(e.bestOf) };
  if (!s.name) return msg('Gefðu mótinu heiti.');
  if (!s.start || !s.end || s.end < s.start) return msg('Athugaðu dagsetningarnar.');
  if (!(s.bestOf >= 1)) return msg('Gildandi hringir verða að vera að minnsta kosti 1.');
  if (s.plannedRounds && s.bestOf > s.plannedRounds) return msg('Gildandi hringir geta ekki verið fleiri en fjöldi hringja.');
  const clash = S.seasons.find(x => x.id !== e.id && x.start <= s.end && s.start <= x.end);
  if (clash) return msg(`Dagsetningar skarast við ${clash.name}.`);
  if (DEMO) {
    if (e.id) S.seasons = S.seasons.map(x => x.id === e.id ? s : x);
    else { s.id = 'demo-s-' + Date.now(); S.seasons.push(s); S.seasonId = s.id; }
  } else {
    const q = e.id ? S.sb.from('seasons').update(toSeason(s)).eq('id', e.id).select() : S.sb.from('seasons').insert(toSeason(s)).select();
    const { data, error } = await q;
    if (error || !data?.length) return msg('Ekki vistað. Aðeins umsjónarmenn geta breytt mótum.');
    if (!e.id) S.seasonId = data[0].id;
    await loadAll();
  }
  S.editSeason = null; render();
}

// Refreshes shouldn't yank the cursor out of a field someone is typing in.
function renderKeepFocus() {
  const a = document.activeElement;
  if (a && a.matches && a.matches('input, select') && a.closest('#main')) { renderSeasons(); return; }
  render();
}

/* ---------- ræsing ---------- */
(async () => {
  if (DEMO) { loadDemo(); S.mode = 'ready'; S.loaded = true; render(); return; }
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase) { S.mode = 'setup'; render(); return; }
  S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  render();
  const { data } = await S.sb.auth.getSession();
  S.session = data.session;
  S.mode = 'ready';
  await Promise.all([loadAll(), loadMember()]);
  answerFromLink();
  S.sb.auth.onAuthStateChange((_event, session) => {
    const changed = (session?.user?.id || null) !== (S.session?.user?.id || null);
    S.session = session;
    if (changed) { S.signinMsg = null; loadMember(); }
  });
  // Pick up answers and rounds others added while this tab sat in the background.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadAll(); });
})();
